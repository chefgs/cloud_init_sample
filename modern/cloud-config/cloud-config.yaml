#cloud-config
##################################################################
# Modern replacement for cloud_init_chef.txt and cloud_init_ansible.txt
#
# Uses cloud-init's native YAML modules instead of a plain bash script.
# This is declarative, idempotent, and works across distros.
#
# Rendered as a Terraform templatefile — variables like ${agent_hostname}
# are substituted at plan/apply time via Terraform's templatefile().
##################################################################

# System hostname — replaces manual hostname command in bash scripts
hostname: ${agent_hostname}
fqdn: ${agent_hostname}.internal
manage_etc_hosts: true

##################################################################
# Groups and Users
# Replaces: useradd / usermod bash commands or Chef user resources
##################################################################

groups:
  - my-staff

users:
  - default  # Keep the default distro user (ec2-user on AL2023)
  %{ for user in users ~}
  - name: ${user}
    gecos: "${user} (demo user)"
    groups: [my-staff]
    shell: /bin/bash
    lock_passwd: true          # No password auth — key or SSM only
    no_create_home: false
    sudo: "ALL=(ALL) NOPASSWD:ALL"
  %{ endfor ~}

##################################################################
# Package management
# Replaces: yum install -y wget git in bash scripts
##################################################################

package_update: true
package_upgrade: false  # Set true in prod to patch on first boot

packages:
  - git
  - ansible-core   # Amazon Linux 2023 ships ansible-core in repo
  - rpm-build      # Required for the dummy RPM creation step

##################################################################
# Write config files declaratively
# Replaces: echo/cat >> /etc/mon-agent/agent.conf in bash
##################################################################

write_files:
  - path: /etc/mon-agent/agent.conf
    permissions: "0644"
    owner: root:root
    defer: true   # Write after packages are installed
    content: |
      # Monitoring agent configuration
      # Generated by cloud-init on first boot
      hostname=${agent_hostname}
      log_level=INFO
      check_interval=60

  - path: /opt/demo/run-playbook.sh
    permissions: "0755"
    owner: root:root
    content: |
      #!/bin/bash
      # Fetch playbook location from SSM Parameter Store at runtime
      PLAYBOOK_REPO=$(aws ssm get-parameter \
        --name "/${project_name}/playbook_repo" \
        --query Parameter.Value --output text 2>/dev/null \
        || echo "https://github.com/chefgs/ansible_playbooks.git")

      mkdir -p /data/ansible
      git clone "$PLAYBOOK_REPO" /data/ansible/playbooks
      ansible-playbook /data/ansible/playbooks/playbook.yml \
        -e "agent_hostname=${agent_hostname}" \
        >> /var/log/ansiblerun.out 2>&1

##################################################################
# Run commands — only for things cloud-init modules can't handle
# Keep this section minimal; prefer modules above
##################################################################

runcmd:
  # Create monitoring agent directories
  - mkdir -p /etc/mon-agent

  # Build and install the monitoring agent RPM
  # In production: this would come from an internal yum/dnf repo
  - |
    mkdir -p /data/rpm_build
    git clone https://github.com/chefgs/create_dummy_rpm.git /data/rpm_build/
    chmod +x /data/rpm_build/create_rpm.sh
    cd /data/rpm_build && ./create_rpm.sh spec_file/my-monitoring-agent.spec \
      >> /var/log/rpm_build.out 2>&1

  # Run the Ansible playbook
  - /opt/demo/run-playbook.sh

##################################################################
# Cloud-init completion signal
# Visible in: sudo cloud-init status --long
##################################################################

final_message: |
  Cloud-init completed for ${project_name}.
  Hostname: ${agent_hostname}
  Users created: ${join(", ", users)}
  Uptime at completion: $UPTIME seconds
  Logs:
    /var/log/cloud-init-output.log
    /var/log/ansiblerun.out
    /var/log/rpm_build.out
